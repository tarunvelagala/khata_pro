name: khata_pro
description: "KhataPro — digital khata book for small business owners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  intl: ^0.20.2
  shared_preferences: ^2.4.0
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  uuid: ^4.5.1
  flutter_contacts: ^2.2.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^13.1.0
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  file_picker: ^12.0.0-beta.5
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  material_symbols_icons: ^4.2831.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  connectivity_plus: ^6.1.0
  local_auth: ^2.3.0
  crypto: ^3.0.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_annotation: ^4.0.2
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_light.png"
  image_path_ios: "assets/icons/icon_light.png"
  image_path_ios_dark_transparent: "assets/icons/icon_dark_transparent.png"
  image_path_ios_tinted_grayscale: "assets/icons/icon_tinted.png"

  # Adaptive Icon Settings
  adaptive_icon_background: "#FAF9FD"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_foreground_dark: "assets/icons/icon_foreground_dark.png"
  adaptive_icon_background_dark: "#2F3033"

  # Monochrome / Themed Icon Settings
  adaptive_icon_monochrome: "assets/icons/icon_monochrome.png"